<body>
<div id="game"></div>

<div id="topbar">
 <div class="logo">HANGOUT.</div>
 <div class="status" id="status">CONNECTING...</div>
</div>

<div id="instructions">Your shared virtual space</div>

<div id="roomInfo">
 ROOM: <span id="roomCode"></span>
 <button id="copyRoom" style="margin-left:8px;padding:5px 9px;border:0;border-radius:7px">COPY</button>
</div>

<div id="joystick">
 <div id="stick"></div>
</div>

<div id="gameButtons">
 <button class="gameBtn" id="chatToggle">CHAT</button>
 <button class="gameBtn" id="leaveRoom">LEAVE ROOM</button>
</div>

<div id="chatPanel">
 <div class="chatHeader">
  <span>ROOM CHAT</span>
  <button id="closeChat" style="background:none;border:0;color:white;font-size:20px">×</button>
 </div>
 <div id="messages"></div>
 <form class="chatInput" id="chatForm">
  <input id="chatMessage" placeholder="Say something..." maxlength="500" autocomplete="off">
  <button type="submit">SEND</button>
 </form>
</div>

<div id="toast"></div>

<div id="roomPanel">
 <div class="panel">
  <h1>HANGOUT.</h1>
  <p class="subtitle">A little world for two. Meet, explore and spend time together.</p>

  <input class="field" id="playerName" maxlength="20" placeholder="Your display name">

  <button class="action" id="createRoom">CREATE A ROOM</button>

  <div style="text-align:center;color:#829091;font-size:11px;margin:5px 0 13px">OR JOIN SOMEONE</div>

  <input class="field" id="joinCode" placeholder="Paste room invitation code">
  <button class="action secondary" id="joinRoom">JOIN ROOM</button>

  <p class="smallText" id="connectionMessage">Connecting to the Hangout server...</p>
 </div>
</div>

<script type="module">
import * as THREE from 'three';
import { createClient } from '@supabase/supabase-js';

/* SUPABASE CONNECTION */

const SUPABASE_URL =
'https://grykpdbvyssmvwqyqpoi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_AXn0IVR3a_sCGZpDtLoOwg_-g5-9rjv';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let currentUser = null;
let currentRoom = null;
let playerName = '';
let realtimeChannel = null;
let remotePlayers = new Map();
let lastSent = 0;
let lastPosition = null;
let busy = false;

function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    el.style.display = 'none';
  }, 3000);
}

function setStatus(message) {
  $('status').textContent = message;
  $('connectionMessage').textContent = message;
}

async function connect() {
  try {
    const {data: sessionData, error: sessionError} =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    if (sessionData.session) {
      currentUser = sessionData.session.user;
    } else {
      const {data, error} =
        await supabase.auth.signInAnonymously();

      if (error) throw error;
      currentUser = data.user;
    }

    setStatus('● CONNECTED');
    $('connectionMessage').textContent =
      'Connected. Choose a name and create or join a room.';
  } catch (error) {
    setStatus('CONNECTION ERROR');
    $('connectionMessage').textContent = error.message;
    console.error(error);
  }
}

await connect();

/* ROOM CREATION */

async function createRoom() {
  if (busy) return;
  busy = true;

  try {
    if (!currentUser) throw new Error('Not connected. Refresh and try again.');

    playerName = $('playerName').value.trim();
    if (!playerName) throw new Error('Enter your display name first.');

    const {data: room, error: roomError} = await supabase
      .from('rooms')
      .insert({created_by: currentUser.id})
      .select()
      .single();

    if (roomError) throw roomError;

    const {error: playerError} = await supabase
      .from('room_players')
      .insert({
        room_id: room.id,
        user_id: currentUser.id,
        display_name: playerName,
        position_x: 0,
        position_z: 2,
        rotation_y: 0,
        is_moving: false
      });

    if (playerError) throw playerError;

    await enterRoom(room);
  } catch (error) {
    toast(error.message);
    console.error(error);
  } finally {
    busy = false;
  }
}

/* JOIN ROOM */

async function joinRoom() {
  if (busy) return;
  busy = true;

  try {
    if (!currentUser) throw new Error('Not connected. Refresh and try again.');

    playerName = $('playerName').value.trim();
    const code = $('joinCode').value.trim();

    if (!playerName) throw new Error('Enter your display name first.');
    if (!code) throw new Error('Enter the room invitation code.');

    const {data: roomId, error} = await supabase.rpc(
      'join_room',
      {
        p_room_code: code,
        p_display_name: playerName
      }
    );

    if (error) throw error;

    const {data: room, error: roomError} = await supabase
      .from('rooms')
      .select('*')
      .eq('id', roomId)
      .single();

    if (roomError) throw roomError;

    await enterRoom(room);
  } catch (error) {
    toast(error.message);
    console.error(error);
  } finally {
    busy = false;
  }
}

/* ENTER SHARED WORLD */

async function enterRoom(room) {
  currentRoom = room;
  $('roomPanel').style.display = 'none';
  $('roomInfo').style.display = 'block';
  $('roomCode').textContent = room.room_code;
  $('instructions').textContent = 'Move around and explore together';
  $('chatPanel').style.display = 'none';

  player.position.set(0, 0, 2);
  player.rotation.y = 0;

  const {data, error} = await supabase
    .from('room_players')
    .select('*')
    .eq('room_id', room.id);

  if (error) throw error;

  data.forEach(p => {
    if (p.user_id !== currentUser.id) addRemotePlayer(p);
  });

  await loadMessages();
  subscribeToRoom();

  setStatus('● ROOM CONNECTED');
  toast('Welcome to your Hangout room!');
}

/* REMOTE PLAYER CREATION */

function createNameSprite(name) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(20,25,28,0.85)';
  ctx.roundRect(8, 8, 496, 112, 35);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, 256, 64, 460);

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      depthTest: false
    })
  );

  sprite.scale.set(1.65, .42, 1);
  sprite.position.y = 3.1;
  return sprite;
}

function makeCharacter(name) {
  const group = new THREE.Group();

  const mat = color => new THREE.MeshStandardMaterial({
    color,
    roughness: .8
  });

  const skin = mat(0x986e50);
  const shirt = mat(0x252b35);
  const pants = mat(0x252a31);
  const shoes = mat(0xe8e8e4);
  const hair = mat(0x191716);

  function sphere(parent,x,y,z,sx,sy,sz,m) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1,16,12),m
    );
    mesh.position.set(x,y,z);
    mesh.scale.set(sx,sy,sz);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }

  function limb(parent,x,y,z,length,radius,m) {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radius*.85,radius,length,10),m
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }

  sphere(group,0,1.35,0,.43,.62,.26,shirt);
  limb(group,0,1.92,0,.2,.13,skin);
  sphere(group,0,2.22,0,.34,.42,.31,skin);
  sphere(group,0,2.48,-.015,.36,.23,.33,hair);
  sphere(group,0,2.39,.255,.29,.12,.12,hair);

  const eyes = mat(0x211d1a);
  sphere(group,-.12,2.25,.294,.035,.035,.02,eyes);
  sphere(group,.12,2.25,.294,.035,.035,.02,eyes);

  const legs = [];
  const arms = [];

  for (const x of [-.17,.17]) {
    const leg = new THREE.Group();
    leg.position.set(x,.87,0);
    group.add(leg);
    limb(leg,0,-.27,0,.55,.105,pants);

    const shoe = new THREE.Mesh(
      new THREE.BoxGeometry(.23,.13,.38),shoes
    );
    shoe.position.set(0,-.56,.07);
    leg.add(shoe);
    legs.push(leg);
  }

  for (const x of [-.5,.5]) {
    const arm = new THREE.Group();
    arm.position.set(x,1.7,0);
    group.add(arm);
    limb(arm,0,-.3,0,.65,.105,shirt);
    sphere(arm,0,-.67,0,.12,.13,.12,skin);
    arms.push(arm);
  }

  group.add(createNameSprite(name));
  group.userData.legs = legs;
  group.userData.arms = arms;
  group.userData.walkTime = 0;

  return group;
}

function addRemotePlayer(data) {
  let remote = remotePlayers.get(data.user_id);

  if (!remote) {
    const character = makeCharacter(data.display_name);
    scene.add(character);

    remote = {
      group: character,
      target: new THREE.Vector3(
        Number(data.position_x) || 0,
        0,
        Number(data.position_z) || 0
      ),
      targetRotation: Number(data.rotation_y) || 0,
      moving: Boolean(data.is_moving)
    };

    remotePlayers.set(data.user_id, remote);
  } else {
    remote.target.set(
      Number(data.position_x) || 0,
      0,
      Number(data.position_z) || 0
    );
    remote.targetRotation = Number(data.rotation_y) || 0;
    remote.moving = Boolean(data.is_moving);
  }
}

function removeRemotePlayer(userId) {
  const remote = remotePlayers.get(userId);
  if (!remote) return;

  scene.remove(remote.group);
  remote.group.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (obj.material.map) obj.material.map.dispose();
      obj.material.dispose();
    }
  });

  remotePlayers.delete(userId);
}

/* REALTIME */

function subscribeToRoom() {
  if (realtimeChannel) {
    supabase.removeChannel(realtimeChannel);
  }

  realtimeChannel = supabase
    .channel('hangout-' + currentRoom.id)

    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'room_players',
      filter: 'room_id=eq.' + currentRoom.id
    }, payload => {
      const row = payload.new || payload.old;

      if (!row || row.user_id === currentUser.id) return;

      if (payload.eventType === 'DELETE') {
        removeRemotePlayer(row.user_id);
      } else {
        addRemotePlayer(row);
      }
    })

    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages',
      filter: 'room_id=eq.' + currentRoom.id
    }, payload => {
      showMessage(payload.new);
    })

    .subscribe(status => {
      if (status === 'SUBSCRIBED') {
        console.log('Realtime connected');
      }
    });
}

/* CHAT */

function addMessageElement(message) {
  const box = document.createElement('div');
  box.className = 'message' +
    (message.user_id === currentUser.id ? ' mine' : '');

  const name = document.createElement('strong');
  name.textContent = message.display_name || 'Player';

  const text = document.createElement('span');
  text.textContent = message.content;

  box.append(name, text);
  $('messages').appendChild(box);
  $('messages').scrollTop = $('messages').scrollHeight;
}

const shownMessages = new Set();

function showMessage(message) {
  if (shownMessages.has(message.id)) return;
  shownMessages.add(message.id);
  addMessageElement(message);
}

async function loadMessages() {
  $('messages').innerHTML = '';
  shownMessages.clear();

  const {data, error} = await supabase
    .from('messages')
    .select('*')
    .eq('room_id', currentRoom.id)
    .order('created_at', {ascending: true})
    .limit(100);

  if (error) {
    console.error(error);
    return;
  }

  data.forEach(showMessage);
}

$('chatForm').addEventListener('submit', async e => {
  e.preventDefault();

  const content = $('chatMessage').value.trim();
  if (!content || !currentRoom) return;

  $('chatMessage').value = '';

  const {error} = await supabase
    .from('messages')
    .insert({
      room_id: currentRoom.id,
      user_id: currentUser.id,
      display_name: playerName,
      content
    });

  if (error) toast('Message failed: ' + error.message);
});

$('chatToggle').addEventListener('click', () => {
  if (!currentRoom) return toast('Join a room first.');

  const panel = $('chatPanel');
  panel.style.display =
    panel.style.display === 'flex' ? 'none' : 'flex';
});

$('closeChat').addEventListener('click', () => {
  $('chatPanel').style.display = 'none';
});

/* CREATE AND JOIN BUTTONS */

$('createRoom').addEventListener('click', createRoom);
$('joinRoom').addEventListener('click', joinRoom);

$('copyRoom').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(
      $('roomCode').textContent
    );
    toast('Room code copied!');
  } catch {
    toast('Select and copy the room code manually.');
  }
});

/* LEAVE ROOM */

$('leaveRoom').addEventListener('click', async () => {
  if (!currentRoom || !currentUser) return;

  const roomId = currentRoom.id;

  if (realtimeChannel) {
    await supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  await supabase
    .from('room_players')
    .delete()
    .eq('room_id', roomId)
    .eq('user_id', currentUser.id);

  for (const id of [...remotePlayers.keys()]) {
    removeRemotePlayer(id);
  }

  currentRoom = null;
  $('roomPanel').style.display = 'flex';
  $('roomInfo').style.display = 'none';
  $('chatPanel').style.display = 'none';
  $('instructions').textContent = 'Your shared virtual space';
  setStatus('● CONNECTED');
  toast('You left the room.');
});

/* THREE.JS WORLD */

const container = $('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9baeb5);
scene.fog = new THREE.Fog(0x9baeb5,13,32);

const camera = new THREE.PerspectiveCamera(
  55,innerWidth/innerHeight,.1,100
);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53616a,2));

const sunlight = new THREE.DirectionalLight(0xffffff,3);
sunlight.position.set(-5,9,5);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024,1024);
scene.add(sunlight);

function material(color,roughness=.85) {
  return new THREE.MeshStandardMaterial({color,roughness});
}

function box(name,x,y,z,sx,sy,sz,mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),mat
  );
  mesh.name = name;
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// ROOM

box('floor',0,-.15,0,15,.3,15,material(0xb8b1a4));
box('back wall',0,2.1,-7.4,15,4.3,.25,material(0xd9d4ca));
box('left wall',-7.4,2.1,0,.25,4.3,15,material(0xd9d4ca));
box('right wall',7.4,2.1,0,.25,4.3,15,material(0xd9d4ca));

box('wall panel',0,2.3,-7.23,4.5,2.8,.08,material(0x292d32));
box('artwork',0,2.4,-7.16,3.6,2,.06,material(0x718c8d));
box('art detail',0,2.4,-7.10,1.2,1.2,.04,material(0xb7a28a));

// SOFA

box('sofa base',-3,.4,-3,3.2,.65,1.2,material(0x4b6266));
box('sofa back',-3,.95,-3.55,3.2,1.1,.3,material(0x4b6266));

for(let i=0;i<3;i++){
  box('cushion',-4+i,.85,-2.95,.9,.2,.8,material(0x708589));
}

// TABLE

box('table top',1.5,.7,-2.5,2.6,.15,1.5,material(0x765440));

for(const x of [.5,2.5]){
  for(const z of [-3,-2]){
    box('table leg',x,.32,z,.12,.7,.12,material(0x292d32));
  }
}

// RUG

box('rug',0,.02,1,5,.04,3.2,material(0x727f7b));

// PLANT

const plant = new THREE.Group();
plant.position.set(5,0,-5);
scene.add(plant);

const pot = new THREE.Mesh(
  new THREE.CylinderGeometry(.4,.3,.65,12),
  material(0x9b755d)
);
pot.position.y=.32;
plant.add(pot);

for(let i=0;i<6;i++){
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(.27,8,8),
    material(0x416a50)
  );
  leaf.scale.set(.7,2,.7);
  leaf.position.set(
    Math.sin(i)*.3,1.15+Math.random()*.4,Math.cos(i)*.3
  );
  leaf.rotation.z=Math.sin(i)*.5;
  plant.add(leaf);
}

// LOCAL PLAYER

const player = makeCharacter('You');
scene.add(player);
player.position.set(0,0,2);

camera.position.set(0,4,8);

/* JOYSTICK */

const joystick = $('joystick');
const stick = $('stick');

let joyX = 0;
let joyY = 0;
let dragging = false;

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  let dx=e.clientX-cx;
  let dy=e.clientY-cy;

  const max=rect.width*.32;
  const distance=Math.hypot(dx,dy);

  if(distance>max){
    dx=dx/distance*max;
    dy=dy/distance*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
}

joystick.addEventListener('pointerdown',e=>{
  dragging=true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener('pointermove',e=>{
  if(dragging) updateJoystick(e);
});

function releaseJoystick(){
  dragging=false;
  joyX=0;
  joyY=0;
  stick.style.left='50%';
  stick.style.top='50%';
}

joystick.addEventListener('pointerup',releaseJoystick);
joystick.addEventListener('pointercancel',releaseJoystick);

/* KEYBOARD */

const keys={};

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

/* MOVEMENT AND CAMERA */

const clock=new THREE.Clock();
let walkTime=0;

function animateRemote(remote,delta){
  remote.group.position.lerp(remote.target,Math.min(1,delta*12));

  let difference=remote.targetRotation-remote.group.rotation.y;
  difference=Math.atan2(Math.sin(difference),Math.cos(difference));
  remote.group.rotation.y+=difference*Math.min(1,delta*10);

  if(remote.moving){
    remote.group.userData.walkTime+=delta*9;
    const t=remote.group.userData.walkTime;
    remote.group.userData.legs[0].rotation.x=Math.sin(t)*.4;
    remote.group.userData.legs[1].rotation.x=-Math.sin(t)*.4;
    remote.group.userData.arms[0].rotation.x=-Math.sin(t)*.25;
    remote.group.userData.arms[1].rotation.x=Math.sin(t)*.25;
  }else{
    remote.group.userData.legs.forEach(l=>l.rotation.x*=.8);
    remote.group.userData.arms.forEach(a=>a.rotation.x*=.8);
  }
}

function animate(){
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.04);

  let x=joyX;
  let z=joyY;

  if(keys['a']||keys['arrowleft']) x=-1;
  if(keys['d']||keys['arrowright']) x=1;
  if(keys['w']||keys['arrowup']) z=-1;
  if(keys['s']||keys['arrowdown']) z=1;

  const moving=Math.abs(x)+Math.abs(z)>.1;

  if(moving){
    const direction=new THREE.Vector3(x,0,z).normalize();

    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3()
      .crossVectors(forward,new THREE.Vector3(0,1,0))
      .normalize();

    const movement=new THREE.Vector3()
      .addScaledVector(right,direction.x)
      .addScaledVector(forward,-direction.z)
      .normalize();

    player.position.addScaledVector(movement,3.2*delta);

    const angle=Math.atan2(movement.x,movement.z);
    let diff=angle-player.rotation.y;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    player.rotation.y+=diff*Math.min(1,delta*10);

    walkTime+=delta*10;
    player.userData.legs[0].rotation.x=Math.sin(walkTime)*.45;
    player.userData.legs[1].rotation.x=-Math.sin(walkTime)*.45;
    player.userData.arms[0].rotation.x=-Math.sin(walkTime)*.3;
    player.userData.arms[1].rotation.x=Math.sin(walkTime)*.3;
    player.children[0].position.y=1.35+Math.abs(Math.sin(walkTime*2))*.035;
  }else{
    player.userData.legs.forEach(l=>l.rotation.x*=.8);
    player.userData.arms.forEach(a=>a.rotation.x*=.8);
    player.children[0].position.y=THREE.MathUtils.lerp(
      player.children[0].position.y,1.35,.1
    );
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-6.5,6.5);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-6.5,6.5);

  const targetCamera=player.position.clone().add(
    new THREE.Vector3(0,4,6)
  );

  camera.position.lerp(targetCamera,1-Math.pow(.001,delta));

  camera.lookAt(
    player.position.x,
    player.position.y+1.2,
    player.position.z
  );

  for(const remote of remotePlayers.values()){
    animateRemote(remote,delta);
  }

  renderer.render(scene,camera);
}

animate();

/* SEND MOVEMENT TO SUPABASE */

setInterval(async()=>{
  if(!currentRoom||!currentUser) return;

  const now=Date.now();
  if(now-lastSent<120) return;
  lastSent=now;

  const moving=Math.abs(joyX)+Math.abs(joyY)>.1 ||
    keys['w']||keys['a']||keys['s']||keys['d']||
    keys['arrowup']||keys['arrowdown']||
    keys['arrowleft']||keys['arrowright'];

  const position={
    x:Number(player.position.x.toFixed(3)),
    z:Number(player.position.z.toFixed(3)),
    rotation:Number(player.rotation.y.toFixed(3)),
    moving:Boolean(moving)
  };

  if(lastPosition &&
    Math.abs(lastPosition.x-position.x)<.025 &&
    Math.abs(lastPosition.z-position.z)<.025 &&
    Math.abs(lastPosition.rotation-position.rotation)<.025 &&
    lastPosition.moving===position.moving
  ) return;

  lastPosition=position;

  const {error}=await supabase
    .from('room_players')
    .update({
      position_x:position.x,
      position_z:position.z,
      rotation_y:position.rotation,
      is_moving:position.moving,
      last_seen:new Date().toISOString()
    })
    .eq('room_id',currentRoom.id)
    .eq('user_id',currentUser.id);

  if(error) console.error('Movement sync:',error.message);
},150);

/* RESIZE */

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>
