
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hangout | Virtual World</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #15191c;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#topbar {
  position: fixed;
  top: 18px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  pointer-events: none;
}

.logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
}

.status {
  font-size: 11px;
  background: rgba(20,25,30,.75);
  padding: 10px 14px;
  border-radius: 30px;
  border: 1px solid #444;
}

#instructions {
  position: fixed;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 12px;
  background: rgba(0,0,0,.4);
  padding: 9px 15px;
  border-radius: 20px;
  white-space: nowrap;
  pointer-events: none;
}

#joystick {
  position: fixed;
  bottom: 32px;
  left: 25px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  border: 2px solid rgba(255,255,255,.3);
  touch-action: none;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  background: rgba(255,255,255,.75);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 3px 15px #0006;
}

#hint {
  position: fixed;
  bottom: 20px;
  right: 18px;
  color: white;
  font-size: 11px;
  opacity: .65;
  text-align: right;
  pointer-events: none;
}

@media (min-width: 800px) {
  #joystick {
    width: 140px;
    height: 140px;
    left: 40px;
    bottom: 40px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="game"></div>

<div id="topbar">
  <div class="logo">HANGOUT.</div>
  <div class="status">● SOLO WORLD</div>
</div>

<div id="instructions">Explore your space</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="hint">
  DRAG TO MOVE<br>
  EXPLORE YOUR WORLD
</div>

<script type="module">
import * as THREE from 'three';

const container = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9baeb5);
scene.fog = new THREE.Fog(0x9baeb5, 13, 32);

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

container.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(
  0xffffff, 0x53616a, 2
));

const sunlight = new THREE.DirectionalLight(0xffffff, 3);
sunlight.position.set(-5, 9, 5);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

// MATERIALS

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const floorMat = material(0xb8b1a4);
const wallMat = material(0xd9d4ca);
const darkMat = material(0x292d32);
const sofaMat = material(0x4b6266);
const woodMat = material(0x765440);

// BOX HELPER

function box(name, x, y, z, sx, sy, sz, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    mat
  );

  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  return mesh;
}

// FLOOR

box('floor', 0, -0.15, 0, 15, 0.3, 15, floorMat);

// ROOM WALLS

box('back wall', 0, 2.1, -7.4, 15, 4.3, .25, wallMat);
box('left wall', -7.4, 2.1, 0, .25, 4.3, 15, wallMat);
box('right wall', 7.4, 2.1, 0, .25, 4.3, 15, wallMat);

// BACK WALL DECORATION

box('wall panel', 0, 2.3, -7.23, 4.5, 2.8, .08, darkMat);
box('artwork', 0, 2.4, -7.16, 3.6, 2, .06,
    material(0x718c8d));

box('art detail', 0, 2.4, -7.10, 1.2, 1.2, .04,
    material(0xb7a28a));

// SOFA

box('sofa base', -3, .4, -3, 3.2, .65, 1.2, sofaMat);
box('sofa back', -3, .95, -3.55, 3.2, 1.1, .3, sofaMat);

for (let i = 0; i < 3; i++) {
  box(
    'cushion',
    -4 + i,
    .85,
    -2.95,
    .9,
    .2,
    .8,
    material(0x708589)
  );
}

// TABLE

box('table top', 1.5, .7, -2.5, 2.6, .15, 1.5, woodMat);

for (let x of [.5, 2.5]) {
  for (let z of [-3, -2]) {
    box('table leg', x, .32, z, .12, .7, .12, darkMat);
  }
}

// RUG

box('rug', 0, .02, 1, 5, .04, 3.2,
    material(0x727f7b));

// PLANT

const plant = new THREE.Group();
plant.position.set(5, 0, -5);
scene.add(plant);

const pot = new THREE.Mesh(
  new THREE.CylinderGeometry(.4, .3, .65, 12),
  material(0x9b755d)
);
pot.position.y = .32;
plant.add(pot);

for (let i = 0; i < 6; i++) {
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(.27, 8, 8),
    material(0x416a50)
  );

  leaf.scale.set(.7, 2, .7);
  leaf.position.set(
    Math.sin(i) * .3,
    1.15 + Math.random() * .4,
    Math.cos(i) * .3
  );

  leaf.rotation.z = Math.sin(i) * .5;
  plant.add(leaf);
}

// CHARACTER

const player = new THREE.Group();
scene.add(player);

const skin = material(0x986e50);
const shirt = material(0x252b35);
const pants = material(0x252a31);
const shoes = material(0xeeeeeb);
const hair = material(0x191716);

function sphere(parent, x, y, z, sx, sy, sz, mat) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 20, 16),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  parent.add(mesh);

  return mesh;
}

function limb(parent, x, y, z, length, radius, mat) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius * .85,
      radius,
      length,
      12
    ),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);

  return mesh;
}

// TORSO
const torso = sphere(
  player, 0, 1.35, 0, .43, .62, .26, shirt
);

// NECK
limb(player, 0, 1.92, 0, .2, .13, skin);

// HEAD
const head = sphere(
  player, 0, 2.22, 0, .34, .42, .31, skin
);

// HAIR
sphere(player, 0, 2.48, -.015, .36, .23, .33, hair);

// Hairline/front
sphere(player, 0, 2.39, .255, .29, .12, .12, hair);

// EYES
const eyeMat = material(0x211d1a);

sphere(player, -.12, 2.25, .294, .035, .035, .02, eyeMat);
sphere(player, .12, 2.25, .294, .035, .035, .02, eyeMat);

// LEGS

const legs = [];

for (let x of [-.17, .17]) {
  const leg = new THREE.Group();
  leg.position.set(x, .87, 0);
  player.add(leg);

  limb(leg, 0, -.27, 0, .55, .105, pants);

  const shoe = box(
    'shoe',
    0, 0, 0, .23, .13, .38, shoes
  );

  shoe.position.set(0, -.56, .07);
  leg.add(shoe);

  legs.push(leg);
}

// ARMS

const arms = [];

for (let x of [-.5, .5]) {
  const arm = new THREE.Group();
  arm.position.set(x, 1.7, 0);
  player.add(arm);

  limb(arm, 0, -.3, 0, .65, .105, shirt);

  sphere(arm, 0, -.67, 0, .12, .13, .12, skin);

  arms.push(arm);
}

// START POSITION

player.position.set(0, 0, 2);
camera.position.set(0, 4, 8);

// JOYSTICK

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');

let joyX = 0;
let joyY = 0;
let dragging = false;

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = e.clientX - centerX;
  let dy = e.clientY - centerY;

  const max = rect.width * .32;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  joyX = dx / max;
  joyY = dy / max;

  stick.style.left = `calc(50% + ${dx}px)`;
  stick.style.top = `calc(50% + ${dy}px)`;
}

joystick.addEventListener('pointerdown', e => {
  dragging = true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener('pointermove', e => {
  if (dragging) updateJoystick(e);
});

function releaseJoystick() {
  dragging = false;
  joyX = 0;
  joyY = 0;
  stick.style.left = '50%';
  stick.style.top = '50%';
}

joystick.addEventListener('pointerup', releaseJoystick);
joystick.addEventListener('pointercancel', releaseJoystick);

// KEYBOARD CONTROLS

const keys = {};

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// MOVEMENT

const clock = new THREE.Clock();

let walkTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), .04);

  let x = joyX;
  let z = joyY;

  if (keys['a'] || keys['arrowleft']) x = -1;
  if (keys['d'] || keys['arrowright']) x = 1;
  if (keys['w'] || keys['arrowup']) z = -1;
  if (keys['s'] || keys['arrowdown']) z = 1;

  const moving = Math.abs(x) + Math.abs(z) > .1;

  if (moving) {
    const direction = new THREE.Vector3(x, 0, z);
    direction.normalize();

    // Camera-relative movement
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();

    const right = new THREE.Vector3()
      .crossVectors(forward, new THREE.Vector3(0,1,0))
      .normalize();

    const movement = new THREE.Vector3()
      .addScaledVector(right, direction.x)
      .addScaledVector(forward, -direction.z)
      .normalize();

    player.position.addScaledVector(
      movement,
      3.2 * delta
    );

    // Face movement direction
    const angle = Math.atan2(
      movement.x,
      movement.z
    );

    let diff = angle - player.rotation.y;

    diff = Math.atan2(Math.sin(diff), Math.cos(diff));

    player.rotation.y += diff * Math.min(1, delta * 10);

    // Walking animation
    walkTime += delta * 10;

    legs[0].rotation.x = Math.sin(walkTime) * .45;
    legs[1].rotation.x = -Math.sin(walkTime) * .45;

    arms[0].rotation.x = -Math.sin(walkTime) * .3;
    arms[1].rotation.x = Math.sin(walkTime) * .3;

    torso.position.y = 1.35 + Math.abs(
      Math.sin(walkTime * 2)
    ) * .035;

  } else {
    legs.forEach(leg => {
      leg.rotation.x *= .8;
    });

    arms.forEach(arm => {
      arm.rotation.x *= .8;
    });

    torso.position.y = THREE.MathUtils.lerp(
      torso.position.y,
      1.35,
      .1
    );
  }

  // KEEP PLAYER INSIDE ROOM
  player.position.x = THREE.MathUtils.clamp(
    player.position.x, -6.5, 6.5
  );

  player.position.z = THREE.MathUtils.clamp(
    player.position.z, -6.5, 6.5
  );

  // FOLLOW CAMERA
  const cameraOffset = new THREE.Vector3(0, 4, 6);

  const targetCamera = player.position.clone()
    .add(cameraOffset);

  camera.position.lerp(targetCamera, 1 - Math.pow(.001, delta));

  camera.lookAt(
    player.position.x,
    player.position.y + 1.2,
    player.position.z
  );

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>

</body>
</html>
