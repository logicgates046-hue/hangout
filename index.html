async function connect() {
  try {

    setStatus('CONNECTION ERROR');

}

/* CHARACTER LABEL */

function createNameSprite(name) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(20,25,28,0.85)';
  ctx.beginPath();
  ctx.roundRect(8,8,496,112,35);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name,256,64,460);

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map:texture,transparent:true,depthTest:false
  }));

  sprite.scale.set(1.65,.42,1);
  sprite.position.y=3.1;
  return sprite;
}

/* SPEECH BUBBLE */

function createSpeechBubble(message) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 180;

  const ctx = canvas.getContext('2d');
  const text = String(message).slice(0,100);

  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.beginPath();
  ctx.roundRect(12,10,488,135,28);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(220,143);
  ctx.lineTo(250,175);
  ctx.lineTo(280,143);
  ctx.fill();

  ctx.fillStyle = '#182326';
  ctx.font = 'bold 27px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const words = text.split(/\s+/);
  const lines = [];
  let line = '';

  for(const word of words) {
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > 430 && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);

  const visible = lines.slice(0,3);
  visible.forEach((item,i) => {
    ctx.fillText(item,256,58 + (i-(visible.length-1)/2)*34,430);
  });

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map:texture,transparent:true,depthTest:false
  }));

  sprite.scale.set(2.05,.72,1);
  sprite.position.y=3.85;
  return sprite;
}

function showBubble(character,message) {
  if(!character) return;

  if(character.userData.bubble) {
    character.remove(character.userData.bubble);
    character.userData.bubble.material.map?.dispose();
    character.userData.bubble.material.dispose();
    clearTimeout(character.userData.bubbleTimer);
  }

  const bubble = createSpeechBubble(message);
  character.add(bubble);
  character.userData.bubble = bubble;

  character.userData.bubbleTimer = setTimeout(() => {
    if(character.userData.bubble === bubble) {
      character.remove(bubble);
      bubble.material.map?.dispose();
      bubble.material.dispose();
      character.userData.bubble = null;
    }
  },4500);
}

/* CHARACTER MODELS */

function makeCharacter(name,gender='male') {
  const group = new THREE.Group();

  const mat = color => new THREE.MeshStandardMaterial({color,roughness:.8});

  const skin = mat(0x986e50);
  const shirt = mat(gender === 'female' ? 0x9b526e : 0x252b35);
  const pants = mat(gender === 'female' ? 0x303747 : 0x252a31);
  const shoes = mat(0xe8e8e4);
  const hair = mat(0x191716);

  function sphere(parent,x,y,z,sx,sy,sz,m) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,16,12),m);
    mesh.position.set(x,y,z);
    mesh.scale.set(sx,sy,sz);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }

  function limb(parent,x,y,z,length,radius,m) {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radius*.85,radius,length,10),m
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
  }

  sphere(group,0,1.35,0,.43,.62,.26,shirt);
  limb(group,0,1.92,0,.2,.13,skin);
  sphere(group,0,2.22,0,.34,.42,.31,skin);

  if(gender === 'male') {
    sphere(group,0,2.48,-.015,.36,.23,.33,hair);
    sphere(group,0,2.39,.255,.29,.12,.12,hair);
  } else {
    sphere(group,0,2.46,-.055,.40,.36,.36,hair);
    sphere(group,0,2.27,-.22,.38,.48,.20,hair);
    sphere(group,-.31,2.12,.02,.12,.43,.13,hair);
    sphere(group,.31,2.12,.02,.12,.43,.13,hair);
    sphere(group,0,2.52,.08,.32,.16,.32,hair);
  }

  const eyes = mat(0x211d1a);
  sphere(group,-.12,2.25,.294,.035,.035,.02,eyes);
  sphere(group,.12,2.25,.294,.035,.035,.02,eyes);

  const legs = [];
  const arms = [];

  for(const x of [-.17,.17]) {
    const leg = new THREE.Group();
    leg.position.set(x,.87,0);
    group.add(leg);
    limb(leg,0,-.27,0,.55,.105,pants);

    const shoe = new THREE.Mesh(new THREE.BoxGeometry(.23,.13,.38),shoes);
    shoe.position.set(0,-.56,.07);
    leg.add(shoe);
    legs.push(leg);
  }

  for(const x of [-.5,.5]) {
    const arm = new THREE.Group();
    arm.position.set(x,1.7,0);
    group.add(arm);
    limb(arm,0,-.3,0,.65,.105,shirt);
    sphere(arm,0,-.67,0,.12,.13,.12,skin);
    arms.push(arm);
  }

  group.add(createNameSprite(name));
  group.userData.legs = legs;
  group.userData.arms = arms;
  group.userData.walkTime = 0;
  group.userData.gender = gender;

  return group;
}

let player = makeCharacter('You','male');
scene.add(player);
player.position.set(0,0,2);
camera.position.set(0,4,8);

function disposeCharacter(character) {
  character.traverse(obj => {
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material) {
      const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
      materials.forEach(m => {
        if(m.map) m.map.dispose();
        m.dispose();
      });
    }
  });
}

/* ROOM CREATION */

async function createRoom() {
  if(busy) return;
  busy = true;

  try {
    if(!currentUser) throw new Error('Not connected. Refresh and try again.');

    playerName = $('playerName').value.trim();
    if(!playerName) throw new Error('Enter your display name first.');

    const {data: room,error: roomError} = await supabase
      .from('rooms')
      .insert({created_by:currentUser.id})
      .select()
      .single();

    if(roomError) throw roomError;

    const {error: playerError} = await supabase
      .from('room_players')
      .insert({
        room_id:room.id,
        user_id:currentUser.id,
        display_name:playerName,
        avatar_gender:selectedAvatar,
        position_x:0,
        position_z:2,
        rotation_y:0,
        is_moving:false
      });

    if(playerError) throw playerError;

    await enterRoom(room);
  } catch(error) {
    toast(error.message);
    console.error(error);
  } finally {
    busy = false;
  }
}

/* JOIN ROOM */

async function joinRoom() {
  if(busy) return;
  busy = true;

  try {
    if(!currentUser) throw new Error('Not connected. Refresh and try again.');

    playerName = $('playerName').value.trim();
    const code = $('joinCode').value.trim();

    if(!playerName) throw new Error('Enter your display name first.');
    if(!code) throw new Error('Enter the room invitation code.');

    const {data: roomId,error} = await supabase.rpc('join_room',{
      p_room_code:code,
      p_display_name:playerName
    });

    if(error) throw error;

    const {data: room,error: roomError} = await supabase
      .from('rooms')
      .select('*')
      .eq('id',roomId)
      .single();

    if(roomError) throw roomError;

    await enterRoom(room);
  } catch(error) {
    toast(error.message);
    console.error(error);
  } finally {
    busy = false;
  }
}

/* ENTER WORLD */

async function enterRoom(room) {
  currentRoom = room;

  const {error: avatarError} = await supabase
    .from('room_players')
    .update({avatar_gender:selectedAvatar})
    .eq('room_id',room.id)
    .eq('user_id',currentUser.id);

  if(avatarError) throw avatarError;

  const oldPosition = player.position.clone();
  const oldRotation = player.rotation.clone();

  scene.remove(player);
  disposeCharacter(player);

  player = makeCharacter(playerName,selectedAvatar);
  player.position.copy(oldPosition);
  player.rotation.copy(oldRotation);
  scene.add(player);

  $('roomPanel').style.display = 'none';
  $('roomInfo').style.display = 'block';
  $('roomCode').textContent = room.room_code;
  $('instructions').textContent = 'Move around and explore together';
  $('chatBar').style.display = 'flex';

  player.position.set(0,0,2);
  player.rotation.y = 0;

  const {data,error} = await supabase
    .from('room_players')
    .select('*')
    .eq('room_id',room.id);

  if(error) throw error;

  remotePlayers.forEach((remote,id) => removeRemotePlayer(id));

  data.forEach(p => {
    if(p.user_id !== currentUser.id) addRemotePlayer(p);
  });

  await loadMessages();
  subscribeToRoom();

  setStatus('● ROOM CONNECTED');
  toast('Welcome to your Hangout room!');
}

/* REMOTE PLAYERS */

function addRemotePlayer(data) {
  let remote = remotePlayers.get(data.user_id);

  if(!remote) {
    const character = makeCharacter(
      data.display_name,
      data.avatar_gender || 'male'
    );
    scene.add(character);

    remote = {
      group:character,
      target:new THREE.Vector3(
        Number(data.position_x)||0,
        0,
        Number(data.position_z)||0
      ),
      targetRotation:Number(data.rotation_y)||0,
      moving:Boolean(data.is_moving)
    };

    remotePlayers.set(data.user_id,remote);
  } else {
    const newGender = data.avatar_gender || 'male';

    if(remote.group.userData.gender !== newGender) {
      const old = remote.group;
      const replacement = makeCharacter(data.display_name,newGender);
      replacement.position.copy(old.position);
      replacement.rotation.copy(old.rotation);
      scene.add(replacement);
      scene.remove(old);
      disposeCharacter(old);
      remote.group = replacement;
    }

    remote.target.set(
      Number(data.position_x)||0,
      0,
      Number(data.position_z)||0
    );
    remote.targetRotation = Number(data.rotation_y)||0;
    remote.moving = Boolean(data.is_moving);
  }
}

function removeRemotePlayer(userId) {
  const remote = remotePlayers.get(userId);
  if(!remote) return;

  clearTimeout(remote.group.userData.bubbleTimer);
  scene.remove(remote.group);
  disposeCharacter(remote.group);
  remotePlayers.delete(userId);
}

/* CHAT */

const shownMessages = new Set();

function showMessage(message,live=false) {
  if(!message || shownMessages.has(message.id)) return;

  shownMessages.add(message.id);

  if(live) {
    if(message.user_id === currentUser.id) {
      showBubble(player,message.content);
    } else {
      const remote = remotePlayers.get(message.user_id);
      if(remote) showBubble(remote.group,message.content);
    }
  }
}

async function loadMessages() {
  shownMessages.clear();

  const {data,error} = await supabase
    .from('messages')
    .select('*')
    .eq('room_id',currentRoom.id)
    .order('created_at',{ascending:true})
    .limit(100);

  if(error) {
    console.error(error);
    return;
  }

  data.forEach(message => showMessage(message,false));
}

$('chatForm').addEventListener('submit',async e => {
  e.preventDefault();

  const input = $('chatMessage');
  const content = input.value.trim();

  if(!content || !currentRoom || !currentUser) return;

  input.value = '';

  const {data,error} = await supabase
    .from('messages')
    .insert({
      room_id:currentRoom.id,
      user_id:currentUser.id,
      display_name:playerName,
      content
    })
    .select()
    .single();

  if(error) {
    toast('Message failed: ' + error.message);
    return;
  }

  showMessage(data,true);
});

/* REALTIME */

function subscribeToRoom() {
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);

  realtimeChannel = supabase
    .channel('hangout-' + currentRoom.id)

    .on('postgres_changes',{
      event:'*',
      schema:'public',
      table:'room_players',
      filter:'room_id=eq.' + currentRoom.id
    },payload => {
      if(payload.eventType === 'DELETE') {
        const deletedUser = payload.old?.user_id;
        if(deletedUser && deletedUser !== currentUser.id) {
          removeRemotePlayer(deletedUser);
        }
        return;
      }

      const row = payload.new;
      if(!row || row.user_id === currentUser.id) return;
      addRemotePlayer(row);
    })

    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages',
      filter:'room_id=eq.' + currentRoom.id
    },payload => {
      showMessage(payload.new,true);
    })

    .subscribe(status => {
      if(status === 'SUBSCRIBED') console.log('Realtime connected');
    });
}

/* BUTTONS */

$('createRoom').addEventListener('click',createRoom);
$('joinRoom').addEventListener('click',joinRoom);

$('copyRoom').addEventListener('click',async () => {
  try {
    await navigator.clipboard.writeText($('roomCode').textContent);
    toast('Room code copied!');
  } catch {
    toast('Select and copy the room code manually.');
  }
});

/* LEAVE ROOM */

$('leaveRoom').addEventListener('click',async () => {
  if(!currentRoom || !currentUser) return;

  const roomId = currentRoom.id;

  if(realtimeChannel) {
    await supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  await supabase.from('room_players')
    .delete()
    .eq('room_id',roomId)
    .eq('user_id',currentUser.id);

  for(const id of [...remotePlayers.keys()]) removeRemotePlayer(id);

  if(player.userData.bubble) {
    player.remove(player.userData.bubble);
    clearTimeout(player.userData.bubbleTimer);
    player.userData.bubble = null;
  }

  currentRoom = null;
  lastPosition = null;
  shownMessages.clear();

  $('roomPanel').style.display = 'flex';
  $('roomInfo').style.display = 'none';
  $('chatBar').style.display = 'none';
  $('chatMessage').value = '';
  $('instructions').textContent = 'Your shared virtual space';

  setStatus('● CONNECTED');
  toast('You left the room.');
});

/* JOYSTICK */

const joystick = $('joystick');
const stick = $('stick');

let joyX = 0;
let joyY = 0;
let dragging = false;

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  let dx=e.clientX-cx;
  let dy=e.clientY-cy;

  const max=rect.width*.32;
  const distance=Math.hypot(dx,dy);

  if(distance>max) {
    dx=dx/distance*max;
    dy=dy/distance*max;
  }

  joyX=dx/max;
  joyY=dy/max;
  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
}

joystick.addEventListener('pointerdown',e => {
  dragging=true;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener('pointermove',e => {
  if(dragging) updateJoystick(e);
});

function releaseJoystick() {
  dragging=false;
  joyX=0;
  joyY=0;
  stick.style.left='50%';
  stick.style.top='50%';
}

joystick.addEventListener('pointerup',releaseJoystick);
joystick.addEventListener('pointercancel',releaseJoystick);

/* KEYBOARD */

const keys={};

window.addEventListener('keydown',e => {
  if(e.target.matches('input,textarea')) return;
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener('keyup',e => {
  keys[e.key.toLowerCase()]=false;
});

/* MOVEMENT */

const clock = new THREE.Clock();
let walkTime = 0;

function animateRemote(remote,delta) {
  remote.group.position.lerp(remote.target,Math.min(1,delta*12));

  let difference=remote.targetRotation-remote.group.rotation.y;
  difference=Math.atan2(Math.sin(difference),Math.cos(difference));
  remote.group.rotation.y+=difference*Math.min(1,delta*10);

  if(remote.moving) {
    remote.group.userData.walkTime+=delta*9;
    const t=remote.group.userData.walkTime;
    remote.group.userData.legs[0].rotation.x=Math.sin(t)*.4;
    remote.group.userData.legs[1].rotation.x=-Math.sin(t)*.4;
    remote.group.userData.arms[0].rotation.x=-Math.sin(t)*.25;
    remote.group.userData.arms[1].rotation.x=Math.sin(t)*.25;
  } else {
    remote.group.userData.legs.forEach(l=>l.rotation.x*=.8);
    remote.group.userData.arms.forEach(a=>a.rotation.x*=.8);
  }
}

function animate() {
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.04);

  let x=joyX;
  let z=joyY;

  if(keys['a']||keys['arrowleft']) x=-1;
  if(keys['d']||keys['arrowright']) x=1;
  if(keys['w']||keys['arrowup']) z=-1;
  if(keys['s']||keys['arrowdown']) z=1;

  const moving=Math.abs(x)+Math.abs(z)>.1;

  if(moving) {
    const direction=new THREE.Vector3(x,0,z).normalize();

    const forward=new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0;
    forward.normalize();

    const right=new THREE.Vector3()
      .crossVectors(forward,new THREE.Vector3(0,1,0))
      .normalize();

    const movement=new THREE.Vector3()
      .addScaledVector(right,direction.x)
      .addScaledVector(forward,-direction.z)
      .normalize();

    player.position.addScaledVector(movement,3.2*delta);

    const angle=Math.atan2(movement.x,movement.z);
    let diff=angle-player.rotation.y;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    player.rotation.y+=diff*Math.min(1,delta*10);

    walkTime+=delta*10;
    player.userData.legs[0].rotation.x=Math.sin(walkTime)*.45;
    player.userData.legs[1].rotation.x=-Math.sin(walkTime)*.45;
    player.userData.arms[0].rotation.x=-Math.sin(walkTime)*.3;
    player.userData.arms[1].rotation.x=Math.sin(walkTime)*.3;
  } else {
    player.userData.legs.forEach(l=>l.rotation.x*=.8);
    player.userData.arms.forEach(a=>a.rotation.x*=.8);
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-6.5,6.5);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-6.5,6.5);

  const targetCamera=player.position.clone().add(new THREE.Vector3(0,4,6));
  camera.position.lerp(targetCamera,1-Math.pow(.001,delta));

  camera.lookAt(
    player.position.x,
    player.position.y+1.2,
    player.position.z
  );

  for(const remote of remotePlayers.values()) animateRemote(remote,delta);

  renderer.render(scene,camera);
}

animate();

/* MOVEMENT SYNC */

setInterval(async() => {
  if(!currentRoom || !currentUser) return;

  const now=Date.now();
  if(now-lastSent<120) return;
  lastSent=now;

  const moving=Math.abs(joyX)+Math.abs(joyY)>.1 ||
    keys['w']||keys['a']||keys['s']||keys['d']||
    keys['arrowup']||keys['arrowdown']||
    keys['arrowleft']||keys['arrowright'];

  const position={
    x:Number(player.position.x.toFixed(3)),
    z:Number(player.position.z.toFixed(3)),
    rotation:Number(player.rotation.y.toFixed(3)),
    moving:Boolean(moving)
  };

  if(lastPosition &&
    Math.abs(lastPosition.x-position.x)<.025 &&
    Math.abs(lastPosition.z-position.z)<.025 &&
    Math.abs(lastPosition.rotation-position.rotation)<.025 &&
    lastPosition.moving===position.moving
  ) return;

  lastPosition=position;

  const {error}=await supabase
    .from('room_players')
    .update({
      position_x:position.x,
      position_z:position.z,
      rotation_y:position.rotation,
      is_moving:position.moving,
      last_seen:new Date().toISOString()
    })
    .eq('room_id',currentRoom.id)
    .eq('user_id',currentUser.id);

  if(error) console.error('Movement sync:',error.message);
},150);

/* RESIZE */

window.addEventListener('resize',() => {
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
